services:
  postgres:
    image: postgres:17-alpine
    container_name: relixor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relixor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relixor_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-relixor}
    volumes:
      - relixor_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relixor} -d ${POSTGRES_DB:-relixor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - relixor_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relixor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-relixor}:${POSTGRES_PASSWORD:-relixor_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-relixor}?schema=public
      JWT_SECRET: ${JWT_SECRET:-relixor_super_secret_jwt_key_minimum_32_characters!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /app/storage/apks
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-500}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:3000,http://127.0.0.1}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@relixor.internal}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-AdminPassword123!}
      ADMIN_DEFAULT_NAME: ${ADMIN_DEFAULT_NAME:-System Administrator}
    volumes:
      - relixor_storage:/app/storage/apks
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - relixor_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: relixor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - relixor_net

  nginx:
    image: nginx:alpine
    container_name: relixor-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - relixor_net

volumes:
  relixor_pgdata:
    driver: local
  relixor_storage:
    driver: local

networks:
  relixor_net:
    driver: bridge
